name: fix-table-directory-top-layer-once
on:
  push:
    paths:
      - '.fix-table-directory-top-layer-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix table directory top layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/editor/tableDirectory.js')
          s = p.read_text(encoding='utf-8')

          old = '''function togglePanel(event) {\n    event?.preventDefault();\n    event?.stopPropagation();\n    const panel = ensurePanel();\n    if (!panel) {\n        console.warn('[World Memory][directory] 目录面板创建失败');\n        return;\n    }\n    panel.classList.toggle('open');\n    if (panel.classList.contains('open')) {\n        refreshTableDirectory();\n    }\n}\n'''
          new = '''function togglePanel(event) {\n    event?.preventDefault();\n    event?.stopPropagation();\n    const panel = ensurePanel();\n    if (!panel) {\n        console.warn('[World Memory][directory] 目录面板创建失败');\n        return;\n    }\n\n    // 表格管理器可能运行在原生 dialog / SillyTavern popup 顶层。\n    // body 子节点即使 z-index 很高，也可能被 top-layer dialog 完全盖住。\n    // 点击时把目录面板迁移到当前管理器所在的弹窗内部，确保可见。\n    const button = event?.currentTarget || event?.target?.closest?.('#table_directory_button');\n    const manager = button?.closest?.('#table_manager_container');\n    const popupHost = manager?.closest?.('dialog, .popup, .popup-container, .popup_content, .popup-content') || manager;\n    if (popupHost && panel.parentElement !== popupHost) {\n        popupHost.appendChild(panel);\n    }\n\n    panel.classList.toggle('open');\n    if (panel.classList.contains('open')) {\n        refreshTableDirectory();\n    }\n}\n'''
          if old not in s:
              raise SystemExit('togglePanel target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/styles/style.css')
          s = p.read_text(encoding='utf-8')
          old = '    z-index: 4000;\n'
          if old in s:
              s = s.replace(old, '    z-index: 2147483647;\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/editor/tableDirectory.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/editor/tableDirectory.js assets/styles/style.css
          git commit -m '修复表格目录被弹窗顶层遮挡' || exit 0
          git push
