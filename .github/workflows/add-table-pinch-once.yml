name: add-table-pinch-once
on:
  push:
    paths:
      - '.add-table-pinch-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add custom pinch zoom for memory tables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/editor/chatSheetsDataView.js')
          s = p.read_text(encoding='utf-8')
          anchor = "const userTableEditInfo = {\n    chatIndex: null,\n    editAble: false,\n    tables: null,\n    tableIndex: null,\n    rowIndex: null,\n    colIndex: null,\n}\n"
          if anchor not in s:
              raise SystemExit('pinch anchor not found')
          code = r'''

// 手机端：仅在横线以下的表格区域启用自定义双指缩放。
// 不改表格数据，只改变 #tableContainer 的显示比例。
let memoryTableScale = 1;
let memoryTablePinchStartDistance = 0;
let memoryTablePinchStartScale = 1;
let memoryTablePinching = false;

function getTouchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy);
}

function getMemoryTablePinchArea(target) {
    return target?.closest?.('#contentContainer.memory-table-pinch-area') || null;
}

function applyMemoryTableScale(area, scale) {
    const tableContainer = area?.querySelector?.('#tableContainer');
    if (!tableContainer) return;
    memoryTableScale = Math.min(2, Math.max(0.6, scale));
    tableContainer.style.zoom = String(memoryTableScale);
    tableContainer.dataset.memoryScale = String(memoryTableScale);
}

document.addEventListener('touchstart', (event) => {
    if (event.touches.length !== 2) return;
    const area = getMemoryTablePinchArea(event.target);
    if (!area) return;
    memoryTablePinching = true;
    memoryTablePinchStartDistance = getTouchDistance(event.touches);
    const tableContainer = area.querySelector('#tableContainer');
    const existingScale = Number(tableContainer?.dataset?.memoryScale || memoryTableScale || 1);
    memoryTablePinchStartScale = Number.isFinite(existingScale) ? existingScale : 1;
}, { passive: true });

document.addEventListener('touchmove', (event) => {
    if (!memoryTablePinching || event.touches.length !== 2) return;
    const area = getMemoryTablePinchArea(event.target);
    if (!area || memoryTablePinchStartDistance <= 0) return;
    const distance = getTouchDistance(event.touches);
    const nextScale = memoryTablePinchStartScale * (distance / memoryTablePinchStartDistance);
    applyMemoryTableScale(area, nextScale);
    event.preventDefault();
}, { passive: false });

document.addEventListener('touchend', (event) => {
    if (event.touches.length < 2) {
        memoryTablePinching = false;
        memoryTablePinchStartDistance = 0;
    }
}, { passive: true });

document.addEventListener('touchcancel', () => {
    memoryTablePinching = false;
    memoryTablePinchStartDistance = 0;
}, { passive: true });
'''
          s = s.replace(anchor, anchor + code, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/editor/chatSheetsDataView.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/editor/chatSheetsDataView.js
          git commit -m '实现表格区域自定义双指缩放'
          git push
