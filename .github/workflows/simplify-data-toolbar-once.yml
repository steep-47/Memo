name: simplify-data-toolbar-once
on:
  push:
    paths:
      - '.simplify-data-toolbar-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify data toolbar
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/templates/manager.html')
          s = p.read_text(encoding='utf-8')

          # 删除顶部说明
          start = s.index('    <small data-i18n="managerDescription">')
          end = s.index('    </small>\n', start) + len('    </small>\n')
          s = s[:start] + s[end:]

          # 删除统计按钮
          start = s.index('            <div style="display: flex; justify-content: center" id="table_data_statistics_button"')
          end = s.index('            </div>\n', start) + len('            </div>\n')
          s = s[:start] + s[end:]

          # 删除复制按钮
          start = s.index('            <div style="display: flex; justify-content: center" id="copy_table_button">')
          end = s.index('            </div>\n', start) + len('            </div>\n')
          s = s[:start] + s[end:]

          # 将导航精简为 ‹ 跳转 ›，移除层数输入和状态说明
          nav_start = s.index('    <div style="display: flex; align-items: center;">')
          nav_end = s.index('    <hr />\n', nav_start)
          nav = '''    <div style="display: flex; align-items: center; justify-content: flex-start;">\n        <div style="display: flex; align-items: center; gap: 4px;">\n            <div id="table_prev_button" title="上一表">\n                <i class="menu_button menu_button_icon fa-solid" style="font-size: 14px; min-width: 28px; height: 28px; padding: 2px 7px;">‹</i>\n            </div>\n            <div id="table_jump_button" title="跳转到指定历史表格">\n                <i class="menu_button menu_button_icon fa-solid" style="font-size: 14px; min-width: 44px; height: 28px; padding: 2px 8px;">跳转</i>\n            </div>\n            <div id="table_next_button" title="下一表">\n                <i class="menu_button menu_button_icon fa-solid" style="font-size: 14px; min-width: 28px; height: 28px; padding: 2px 7px;">›</i>\n            </div>\n        </div>\n    </div>\n'''
          s = s[:nav_start] + nav + s[nav_end:]
          p.write_text(s, encoding='utf-8')

          # 跳转按钮改为弹出输入，不再依赖页面上的“层数”输入框
          p = Path('scripts/editor/chatSheetsDataView.js')
          s = p.read_text(encoding='utf-8')
          old = '''    // 点击跳转按钮\n    $(document).on('click', '#table_jump_button', function () {\n        const inputVal = $('#table_jump_input').val();\n        const deep = inputVal === "" ? USER.getContext().chat.length - 1: Number(inputVal);\n        const { deep: prevDeep } = BASE.getLastSheetsPiece(Math.abs(deep), 20, deep < 0);\n        if (prevDeep === -1) {\n            EDITOR.error("没有更多的表格数据了")\n            return\n        }\n        renderSheetsDOM(prevDeep);\n    })\n'''
          new = '''    // 点击跳转按钮：按需输入历史层数，主界面不再常驻输入框\n    $(document).on('click', '#table_jump_button', async function () {\n        const inputVal = await EDITOR.callGenericPopup('跳转到历史表格', EDITOR.POPUP_TYPE.INPUT, '', { okButton: "跳转", cancelButton: "取消" });\n        if (inputVal === false || inputVal === null || inputVal === undefined || String(inputVal).trim() === '') return;\n        const deep = Number(inputVal);\n        if (!Number.isFinite(deep)) {\n            EDITOR.error("请输入有效层数")\n            return\n        }\n        const { deep: prevDeep } = BASE.getLastSheetsPiece(Math.abs(deep), 20, deep < 0);\n        if (prevDeep === -1) {\n            EDITOR.error("没有更多的表格数据了")\n            return\n        }\n        renderSheetsDOM(prevDeep);\n    })\n'''
          if old not in s:
              raise SystemExit('jump handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/editor/chatSheetsDataView.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/templates/manager.html scripts/editor/chatSheetsDataView.js
          git commit -m '精简数据页工具栏与历史导航'
          git push
