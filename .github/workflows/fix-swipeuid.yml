name: fix-swipeuid-once
on:
  push:
    paths:
      - '.fix-swipeuid-trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix swipe uid typo and verify syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/runtime/separateTableUpdate.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('chat.two_step_links[chatSwipeUid] = []', 'chat.two_step_links[swipeUid] = []')
          s=s.replace('chat.two_step_waiting[chatSwipeUid] = true', 'chat.two_step_waiting[swipeUid] = true')
          s=s.replace('return chatSwipeUid;\n}\n\nfunction checkIfChatIsExecuted', 'return swipeUid;\n}\n\nfunction checkIfChatIsExecuted')
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/runtime/separateTableUpdate.js
          node --check services/translate.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runtime/separateTableUpdate.js
          git commit -m '修复人物优化中的 swipe uid 变量名' || exit 0
          git push
