name: integrate-structure-repair

on:
  push:
    paths:
      - '.integrate-structure-repair-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate structure repair into rebuildSheets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) absoluteRefresh.js: import + direct call inside rebuildSheets
          p = Path('scripts/runtime/absoluteRefresh.js')
          s = p.read_text(encoding='utf-8')
          anchor = 'import { safeParse } from \'../../utils/stringUtil.js\';\n'
          ins = anchor + 'import { repairMissingColumnsBeforeCleanup } from "./tableStructureRepair.js";\n'
          if 'repairMissingColumnsBeforeCleanup' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('absoluteRefresh import anchor mismatch')
              s = s.replace(anchor, ins, 1)
          func_anchor = 'export async function rebuildSheets() {\n'
          replacement = func_anchor + '    // 表格整理的唯一结构修复入口：先恢复缺失标准列，再继续原整理流程。\n    repairMissingColumnsBeforeCleanup();\n'
          if replacement not in s:
              if s.count(func_anchor) != 1:
                  raise SystemExit('rebuildSheets anchor mismatch')
              s = s.replace(func_anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')

          # 2) helper: remove document click listener, keep exported function only
          p = Path('scripts/runtime/tableStructureRepair.js')
          s = p.read_text(encoding='utf-8')
          marker = '// 使用捕获阶段：先修复结构，再让原作者 #table_clear_up 点击处理继续执行。\n'
          if marker in s:
              s = s[:s.index(marker)] + 'export { repairMissingColumnsBeforeCleanup };\n'
          elif 'document.addEventListener' in s:
              raise SystemExit('unexpected helper listener layout')
          p.write_text(s, encoding='utf-8')

          # 3) loader: remove direct helper import and bump cache to memo46
          p = Path('loader.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import './scripts/runtime/tableStructureRepair.js?v=memo45';\n", '')
          s = s.replace('memo45', 'memo46')
          p.write_text(s, encoding='utf-8')

          # 4) manifest version
          p = Path('manifest.json')
          s = p.read_text(encoding='utf-8').replace('2.2.18-memo.45', '2.2.18-memo.46')
          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/runtime/absoluteRefresh.js
          node --check scripts/runtime/tableStructureRepair.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runtime/absoluteRefresh.js scripts/runtime/tableStructureRepair.js loader.js manifest.json
          git commit -m '将表格结构修复接入整理主入口' || exit 0
          git push
