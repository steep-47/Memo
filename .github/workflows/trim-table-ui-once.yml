name: trim-table-ui-once
on:
  push:
    paths:
      - '.trim-table-ui-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trim table UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/editor/tableTemplateEditView.js')
          s = p.read_text(encoding='utf-8')

          # 1) 表格属性弹窗仅保留用户真正需要的字段
          start = s.index('    sheetConfig: {')
          end = s.index('    },\n};', start)
          block = s[start:end]
          for snippet in [
              '''            {\n                label: '类型', type: 'select', dataKey: 'type',\n                options: [\n                    // { value: 'free', text: `<i class="fa-solid fa-table"></i> Free（AI 可以任意修改此表格）` },\n                    { value: 'dynamic', text: `<i class="fa-solid fa-arrow-down-wide-short"></i> Dynamic（AI 可进行插入列外的所有操作）` },\n                    // { value: 'fixed', text: `<i class="fa-solid fa-thumbtack"></i> Fixed（AI 无法删除或插入行与列）` },\n                    // { value: 'static', text: `<i class="fa-solid fa-link"></i> Static（该表对 AI 为只读）` }\n                ],\n            },\n''',
              "            { label: '是否必填', type: 'checkbox', dataKey: 'required' },\n",
              "            { label: '是否触发发送', type: 'checkbox', dataKey: 'triggerSend', },\n",
              "            { label: '触发发送深度', type: 'number', dataKey: 'triggerSendDeep' },\n",
          ]:
              if snippet not in block:
                  raise SystemExit('target form field not found: ' + snippet.splitlines()[0])
              block = block.replace(snippet, '', 1)
          block = block.replace('formDescription: "设置表格的域、类型和名称。",', 'formDescription: "设置表格名称与记忆提示。",', 1)
          s = s[:start] + block + s[end:]

          # 2) 删除每张表标题旁固定的魔法棒按钮
          style_block = '''    // 表格自定义样式按钮\n    const styleButton = $(`<i class="menu_button menu_button_icon fa-solid fa-wand-magic-sparkles" style="cursor: pointer; height: 28px; width: 28px;" title="编辑表格显示样式"></i>`);\n    styleButton.on('click', async () => {\n        await openSheetStyleRendererPopup(sheet);\n    })\n'''
          if style_block not in s:
              raise SystemExit('fixed style button block not found')
          s = s.replace(style_block, '', 1)
          append_line = '    titleBar.appendChild(styleButton[0]);\n'
          if append_line not in s:
              raise SystemExit('style button append not found')
          s = s.replace(append_line, '', 1)

          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/editor/tableTemplateEditView.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/editor/tableTemplateEditView.js
          git commit -m '精简表格标题与属性设置' || exit 0
          git push
