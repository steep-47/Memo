name: simplify-ui-once
on:
  push:
    paths:
      - '.simplify-ui-trigger'
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append safe UI-only simplification CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/styles/style.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* WORLD-MEMORY-SIMPLE-UI */'
          if marker not in s:
              s += r'''

/* WORLD-MEMORY-SIMPLE-UI
   自用简化模式：仅隐藏高级设置，不删除 DOM、不改变配置值、不影响底层逻辑。 */

/* 调试开关隐藏，保留总启用开关作为紧急停用入口 */
.checkbox_label:has(> #table_switch_debug_mode) {
    display: none !important;
}

/* 消息模板与注入属于内部协议，当前版本已固定，不在日常界面暴露 */
h4[data-i18n="Message template"],
div:has(> #dataTable_message_template),
div:has(> #dataTable_injection_mode) {
    display: none !important;
}

/* 自动记录模式已固定为收到消息后独立填表，不再让用户误切模式 */
label[for="fill_table_time"],
#fill_table_time,
#reply_options {
    display: none !important;
}

/* 独立填表：隐藏固定/高级项，只保留立即填表和上下文层数 */
#step_by_step_options > .checkbox_label:first-child > #step_by_step_use_main_api,
#step_by_step_options > .checkbox_label:first-child > #step_by_step_use_main_api + span,
#step_by_step_options > .checkbox_label:first-child > label[for="separateReadLorebook"],
#step_by_step_options > .checkbox_label:first-child > #separateReadLorebook,
#step_by_step_options > .checkbox_label:first-child > small,
.checkbox_label:has(> #confirm_before_execution),
.inline-drawer:has(#custom_api_url) {
    display: none !important;
}

/* 独立填表整体协议为核心内部配置，避免误改导致自动记录失效 */
div:has(> div > label[for="step_by_step_user_prompt"]),
div:has(> #step_by_step_user_prompt) {
    display: none !important;
}

/* 设置页里的整套“表格整理”高级配置隐藏；管理表格页面仍保留真正的表格整理按钮 */
.inline-drawer:has(#rebuild--select) {
    display: none !important;
}

/* 前端表格渲染属于非核心显示功能，自用版默认不暴露这一大组 */
.flex1.wide100p:has(#show_settings_in_extension_menu) {
    display: none !important;
}

/* 让剩余的独立填表常用控件更像一组正常设置 */
#step_by_step_options > .checkbox_label:first-child {
    display: flex !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    gap: 8px 10px !important;
    margin: 8px 0 12px !important;
}
#step_by_step_options > .checkbox_label:first-child > label[for="separateReadContextLayers"] {
    margin-left: 0 !important;
    white-space: nowrap !important;
}
#trigger_step_by_step_button {
    margin-left: 0 !important;
}
#separateReadContextLayers {
    width: 64px !important;
}

/* 给简化后的运行区一个简短说明 */
#step_by_step_options::before {
    content: '自动记录已启用 · 一般无需设置';
    display: block;
    margin: 6px 0 8px;
    opacity: .72;
    font-size: .9em;
}

@media screen and (max-width: 768px) {
    #step_by_step_options {
        padding-left: 0 !important;
        width: 100% !important;
    }
    #step_by_step_options > .checkbox_label:first-child {
        display: grid !important;
        grid-template-columns: auto minmax(88px, 1fr) auto 72px !important;
        gap: 8px !important;
        width: 100% !important;
    }
    #trigger_step_by_step_button {
        min-width: 110px !important;
        justify-content: center !important;
    }
    #step_by_step_options > .checkbox_label:first-child > label[for="separateReadContextLayers"] {
        white-space: nowrap !important;
    }
}
'''
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/styles/style.css
          git commit -m '简化自用插件设置界面' || exit 0
          git push
