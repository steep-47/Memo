name: hide-wand-once
on:
  push:
    paths:
      - '.hide-wand-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove custom style menu entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/editor/chatSheetsDataView.js')
          s = p.read_text(encoding='utf-8')
          old = "            menu.add('<i class=\"fa-solid fa-wand-magic-sparkles\"></i> 自定义表格样式', async () => customSheetStyle(cell));\n"
          if old not in s:
              raise SystemExit('custom style menu entry not found')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check scripts/editor/chatSheetsDataView.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/editor/chatSheetsDataView.js
          git commit -m '隐藏自定义表格样式魔法棒入口' || exit 0
          git push
