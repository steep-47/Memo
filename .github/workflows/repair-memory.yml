name: repair-memory

on:
  push:
    paths:
      - '.repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix silent main API loading toast null access
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/settings/standaloneAPI.js')
          s = p.read_text(encoding='utf-8')
          old = '        loadingToast.close();\n        return suspended ? \'suspended\' : response;'
          new = '        loadingToast?.close();\n        loadingToast = null;\n        return suspended ? \'suspended\' : response;'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 unguarded close sites, found {count}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/settings/standaloneAPI.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/settings/standaloneAPI.js
          git commit -m '修复静默自动填表主API空对象错误' || exit 0
          git push
