name: repair-memory

on:
  push:
    paths:
      - '.repair-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify cleanup table input with manual memory update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/runtime/absoluteRefresh.js')
          s = p.read_text(encoding='utf-8')

          old_import = 'import {  convertOldTablesToNewSheets, executeTableEditActions, getTableEditTag } from "../../index.js";'
          new_import = 'import {  convertOldTablesToNewSheets, executeTableEditActions, getTableEditTag, getTablePromptByPiece } from "../../index.js";'
          if s.count(old_import) != 1:
              raise SystemExit('absoluteRefresh import site changed; aborting safely')
          s = s.replace(old_import, new_import, 1)

          old_block = '''        const tableJson = latestTables.map((table, index) => ({...table.getReadableJson(), tableIndex: index}));
        const tableJsonText = JSON.stringify(tableJson);
'''
          new_block = '''        // 与“手动更新记忆”统一：当前表格使用 Memo 原生文本格式。
        // 这里只统一输入表示；现有整理输出/保存链保持不变。
        const currentTableText = getTablePromptByPiece(piece);
'''
          if s.count(old_block) != 1:
              raise SystemExit('table input block changed; aborting safely')
          s = s.replace(old_block, new_block, 1)

          old_log = "        console.log('重整理 - 最新的表格数据:', tableJsonText);"
          if s.count(old_log) != 1:
              raise SystemExit('cleanup log site changed; aborting safely')
          s = s.replace(old_log, "        console.log('重整理 - 最新的表格数据:', currentTableText);", 1)

          old_system = 'output = output.replace(/\\$0/g, tableJsonText);'
          if s.count(old_system) != 1:
              raise SystemExit(f'expected one system $0 replacement, found {s.count(old_system)}')
          s = s.replace(old_system, 'output = output.replace(/\\$0/g, () => currentTableText);', 1)

          old_user = 'userPrompt = userPrompt.replace(/\\$0/g, tableJsonText);'
          if s.count(old_user) != 1:
              raise SystemExit(f'expected one user $0 replacement, found {s.count(old_user)}')
          s = s.replace(old_user, 'userPrompt = userPrompt.replace(/\\$0/g, () => currentTableText);', 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/runtime/absoluteRefresh.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/runtime/absoluteRefresh.js
          git commit -m '统一表格整理与手动更新的表格输入格式'
          git push
